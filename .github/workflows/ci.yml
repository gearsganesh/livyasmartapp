name: LIVYA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/livya_ci?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: livya_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d livya_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Install API dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        working-directory: server
        run: npx prisma validate

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Generate initial Prisma migration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: server
        run: |
          set -euo pipefail
          migration_dir="prisma/migrations/20261017000000_initial_livya_schema"
          mkdir -p "$migration_dir"
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > "$migration_dir/migration.sql"
          test -s "$migration_dir/migration.sql"
          npx prisma migrate deploy
          git add "$migration_dir/migration.sql"
          if git diff --cached --quiet; then
            echo "Initial migration is already committed; no changes to push."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add initial Prisma migration"
            git push origin HEAD:main
          fi

      - name: Check backend JavaScript syntax
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src prisma -type f -name '*.js' -print0)
