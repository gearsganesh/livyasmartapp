name: LIVYA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/livya_ci?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Install API dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        working-directory: server
        run: npx prisma validate

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Generate initial migration preview
        working-directory: server
        run: |
          mkdir -p /tmp/livya-prisma-migration
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/livya-prisma-migration/migration.sql
          test -s /tmp/livya-prisma-migration/migration.sql

      - name: Upload generated migration preview
        uses: actions/upload-artifact@v4
        with:
          name: livya-initial-prisma-migration
          path: /tmp/livya-prisma-migration/migration.sql
          if-no-files-found: error
          retention-days: 3

      - name: Check backend JavaScript syntax
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src prisma -type f -name '*.js' -print0)
